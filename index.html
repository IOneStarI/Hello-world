<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h1 class="greeting">Hello World!</h1>
            <p class="subtitle">Where every legend begins...</p>
            
            <div class="content">
                <p class="welcome">Welcome to JavaScript & Web Development!</p>
                <p class="time" id="time-display"></p>
            </div>
        </div>
    </div>

    <script>
        // Display current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('time-display').textContent = `It's ${timeString} - the perfect time for Hello World!`;
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
